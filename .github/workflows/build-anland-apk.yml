name: Build signed standard Anland APK

on:
  push:
    branches: [main]
    paths: ["app/**", "tools/**", ".github/workflows/build-anland-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GRADLE_VERSION: "9.7.1"
      ANDROID_NDK_VERSION: "29.0.14206865"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.1.0" "ndk;$ANDROID_NDK_VERSION" "cmake;3.22.1"
      - name: Restore signing keystore
        shell: bash
        env:
          ANLAND_KEYSTORE_B64: ${{ secrets.ANLAND_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ANLAND_KEYSTORE_B64"
          umask 077
          printf '%s' "$ANLAND_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/anland-signing.jks"
          echo "ANLAND_KEYSTORE_PATH=$RUNNER_TEMP/anland-signing.jks" >> "$GITHUB_ENV"
      - name: Build signed standard APK
        shell: bash
        env:
          ANLAND_KEY_ALIAS: ${{ secrets.ANLAND_KEY_ALIAS }}
          ANLAND_STORE_PASSWORD: ${{ secrets.ANLAND_STORE_PASSWORD }}
          ANLAND_KEY_PASSWORD: ${{ secrets.ANLAND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools/build-app.sh
      - name: Verify signatures and calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          for apk in out/*.apk; do
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
            grep -F 'Signer #1 certificate SHA-256 digest: b6da01480eefd5fbf2cd3771b8d1021ec791304bdd6c4bf41d3faabad48ee5e1' "$RUNNER_TEMP/cert.txt"
          done
          (cd out && sha256sum *.apk | sort -k2 > sha256sums.txt)
      - name: Upload signed standard APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: anland-signed-${{ github.sha }}
          path: |
            out/*.apk
            out/sha256sums.txt
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/anland-signing.jks"
