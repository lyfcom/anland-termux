plugins {
    id "com.android.application" version "9.4.0"
}

android {
    namespace = "com.anland.latencyprobe"
    compileSdk = 37
    compileSdkMinor = 2
    enableKotlin = false

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        termuxGitHub {
            storeFile = System.getenv("ANLAND_KEYSTORE_PATH")
                ? file(System.getenv("ANLAND_KEYSTORE_PATH"))
                : rootProject.file("testkey_untrusted.jks")
            keyAlias = System.getenv("ANLAND_KEY_ALIAS") ?: "alias"
            storePassword = System.getenv("ANLAND_STORE_PASSWORD") ?: "xrj45yWGLbsO7W0v"
            keyPassword = System.getenv("ANLAND_KEY_PASSWORD") ?: "xrj45yWGLbsO7W0v"
        }
    }

    defaultConfig {
        applicationId = "com.anland.latencyprobe"
        minSdk = 33
        targetSdk = 37
        versionCode = 1
        versionName = "display-probe"
    }

    flavorDimensions "transport"
    productFlavors {
        standard {
            dimension "transport"
        }
    }
    sourceSets {
        main {
            manifest.srcFile "src/probe/AndroidManifest.xml"
            java.srcDirs = ["src/probe/java"]
            res.srcDirs = []
        }
        standard.manifest.srcFile "src/probe/standard.xml"
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.termuxGitHub
        }
    }
}
